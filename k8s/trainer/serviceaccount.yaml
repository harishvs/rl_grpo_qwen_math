# GRPO Trainer Service Account
# Uses IRSA (IAM Roles for Service Accounts) for AWS access
# Replace ACCOUNT_ID with your AWS account ID
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grpo-trainer-sa
  labels:
    app: grpo-trainer
    component: model-training
  annotations:
    # IRSA annotation - replace with your IAM role ARN
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/grpo-trainer-role
