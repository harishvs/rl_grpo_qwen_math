apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: verl-training
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [default]
  selector:
    matchLabels:
      ray.io/node-type: head
      ray.io/cluster: verl-grpo
  podMetricsEndpoints:
  - port: metrics
    interval: 15s
