apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-verl
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  verl-training.json: |
    {
      "annotations": {"list": []},
      "title": "veRL GRPO Training",
      "uid": "verl-grpo",
      "panels": [
        {
          "title": "Reward (score/mean)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{"expr": "verl_critic_score_mean", "legendFormat": "reward"}],
          "fieldConfig": {"defaults": {"min": 0, "max": 1}}
        },
        {
          "title": "Validation Reward",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [{"expr": "verl_val_reward", "legendFormat": "val_reward"}],
          "fieldConfig": {"defaults": {"min": 0, "max": 1}}
        },
        {
          "title": "Policy Loss",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [{"expr": "verl_actor_pg_loss", "legendFormat": "pg_loss"}]
        },
        {
          "title": "KL Divergence",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [{"expr": "verl_actor_ppo_kl", "legendFormat": "kl"}]
        },
        {
          "title": "Entropy",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 16},
          "targets": [{"expr": "verl_actor_entropy", "legendFormat": "entropy"}]
        },
        {
          "title": "Gradient Norm",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 16},
          "targets": [{"expr": "verl_actor_grad_norm", "legendFormat": "grad_norm"}]
        },
        {
          "title": "Step Time (s)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 16},
          "targets": [{"expr": "verl_timing_s_step", "legendFormat": "step_time"}],
          "fieldConfig": {"defaults": {"unit": "s"}}
        },
        {
          "title": "Training Step",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 24},
          "targets": [{"expr": "verl_global_step", "legendFormat": "step"}]
        },
        {
          "title": "GPU Memory (GB)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 9, "x": 6, "y": 24},
          "targets": [{"expr": "verl_perf_max_memory_allocated_gb", "legendFormat": "allocated"}],
          "fieldConfig": {"defaults": {"unit": "decgbytes"}}
        },
        {
          "title": "Throughput (tokens/s)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 9, "x": 15, "y": 24},
          "targets": [{"expr": "verl_perf_throughput", "legendFormat": "throughput"}]
        }
      ],
      "time": {"from": "now-6h", "to": "now"},
      "refresh": "30s",
      "schemaVersion": 39
    }
