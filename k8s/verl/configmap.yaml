apiVersion: v1
kind: ConfigMap
metadata:
  name: verl-scripts
data:
  prep_data.py: |
    """Prep GSM8K into verl parquet format."""
    import os, re, datasets
    def extract_solution(s):
        m = re.search(r"#### (\-?[0-9\.\,]+)", s)
        assert m is not None
        return m.group(1).replace(",", "")
    def make_map_fn(split):
        def process_fn(example, idx):
            q = example.pop("question")
            a = example.pop("answer")
            return {
                "data_source": "openai/gsm8k",
                "prompt": [{"role": "user", "content": q + ' Let\'s think step by step and output the final answer after "####".'}],
                "ability": "math",
                "reward_model": {"style": "rule", "ground_truth": extract_solution(a)},
                "extra_info": {"split": split, "index": idx, "answer": a, "question": q},
            }
        return process_fn
    ds = datasets.load_dataset("openai/gsm8k", "main")
    os.makedirs("/data/gsm8k", exist_ok=True)
    ds["train"].map(function=make_map_fn("train"), with_indices=True).to_parquet("/data/gsm8k/train.parquet")
    ds["test"].map(function=make_map_fn("test"), with_indices=True).to_parquet("/data/gsm8k/test.parquet")
    print("Data prep done")

  reward.py: |
    import re
    def compute_score(data_source, solution_str, ground_truth, extra_info=None):
        match = re.search(r"####\s*(\-?[0-9\.\,]+)", solution_str)
        if match is None:
            return 0.0
        predicted = match.group(1).replace(",", "").strip()
        gt = str(ground_truth).replace(",", "").strip()
        try:
            return 1.0 if float(predicted) == float(gt) else 0.0
        except ValueError:
            return 1.0 if predicted == gt else 0.0

  cloudwatch_metrics.py: |
    """Sidecar: tail veRL worker log and expose metrics for Prometheus.
    Runs on the head pod."""
    import glob, os, re, time
    from prometheus_client import start_http_server, Gauge

    POLL_INTERVAL = 10
    PORT = 9090

    gauges = {}
    METRIC_KEYS = [
        "critic/score/mean", "critic/score/max", "critic/score/min",
        "actor/ppo_kl", "actor/pg_loss", "actor/entropy", "actor/grad_norm",
        "actor/pg_clipfrac", "actor/kl_loss",
        "timing_s/step", "timing_s/gen", "timing_s/update_actor", "timing_s/ref",
        "response_length/mean", "perf/max_memory_allocated_gb",
        "perf/throughput", "perf/total_num_tokens",
    ]
    VAL_KEY_PREFIX = "val-core"

    def gauge_name(key):
        return "verl_" + re.sub(r"[^a-zA-Z0-9_]", "_", key)

    def get_gauge(key):
        name = gauge_name(key)
        if name not in gauges:
            gauges[name] = Gauge(name, key, ["run"])
        return gauges[name]

    # Global step gauge
    step_gauge = Gauge("verl_global_step", "Current training step", ["run"])
    run = os.environ.get("VERL_EXPERIMENT", "default")

    def find_worker_log():
        for _ in range(600):
            logs = sorted(glob.glob("/tmp/ray/session_latest/logs/worker-*.out"),
                         key=os.path.getmtime, reverse=True)
            for f in logs:
                with open(f) as fh:
                    if "step:" in fh.read(4096):
                        return f
            time.sleep(10)
        return None

    def parse_and_update(log_path):
        last_step = -1
        with open(log_path) as f:
            for line in f:
                if not line.startswith("step:"):
                    continue
                parts = dict(p.split(":", 1) for p in line.strip().split(" - ") if ":" in p)
                step = int(float(parts.get("training/global_step", parts.get("step", "0"))))
                if step <= last_step:
                    continue
                last_step = step
                step_gauge.labels(run=run).set(step)
                for k, v in parts.items():
                    if k.startswith(VAL_KEY_PREFIX):
                        get_gauge("val_reward").labels(run=run).set(float(v))
                for key in METRIC_KEYS:
                    if key in parts:
                        get_gauge(key).labels(run=run).set(float(parts[key]))
                print(f"step {step}: updated metrics", flush=True)

    start_http_server(PORT)
    print(f"Prometheus metrics server on :{PORT}", flush=True)
    log_path = find_worker_log()
    if not log_path:
        print("ERROR: no worker log found, waiting...")
        while not log_path:
            time.sleep(30)
            log_path = find_worker_log()
    print(f"Tailing {log_path}", flush=True)
    while True:
        parse_and_update(log_path)
        time.sleep(POLL_INTERVAL)

  run_grpo.sh: |
    #!/bin/bash
    set -ex
    # All VERL_* env vars are set by the launch script from config/verl/*.yaml
    : "${VERL_MODEL:=Qwen/Qwen2.5-1.5B}"
    : "${VERL_EXPERIMENT:=default}"
    : "${VERL_TRAIN_BATCH_SIZE:=256}"
    : "${VERL_MAX_PROMPT_LENGTH:=512}"
    : "${VERL_MAX_RESPONSE_LENGTH:=1024}"
    : "${VERL_MINI_BATCH_SIZE:=128}"
    : "${VERL_MICRO_BATCH_SIZE:=16}"
    : "${VERL_LR:=5e-6}"
    : "${VERL_ACTOR_PARAM_OFFLOAD:=False}"
    : "${VERL_ACTOR_OPTIMIZER_OFFLOAD:=False}"
    : "${VERL_GRADIENT_CHECKPOINTING:=True}"
    : "${VERL_GPU_MEM_UTIL:=0.5}"
    : "${VERL_ROLLOUT_N:=8}"
    : "${VERL_ROLLOUT_LOG_PROB_MICRO_BATCH:=32}"
    : "${VERL_ROLLOUT_TP:=1}"
    : "${VERL_REF_LOG_PROB_MICRO_BATCH:=32}"
    : "${VERL_REF_PARAM_OFFLOAD:=True}"
    : "${VERL_N_GPUS:=8}"
    : "${VERL_NNODES:=2}"
    : "${VERL_TOTAL_EPOCHS:=1}"
    : "${VERL_SAVE_FREQ:=20}"
    : "${VERL_TEST_FREQ:=10}"

    # Prep data
    python3 /scripts/prep_data.py
    # Start Prometheus metrics exporter
    pip install -q prometheus_client
    python3 /scripts/cloudwatch_metrics.py &
    # Download model
    python3 -c "from transformers import AutoModelForCausalLM, AutoTokenizer; AutoTokenizer.from_pretrained('${VERL_MODEL}'); AutoModelForCausalLM.from_pretrained('${VERL_MODEL}')"
    # Run GRPO
    python3 -m verl.trainer.main_ppo \
      algorithm.adv_estimator=grpo \
      data.train_files=/data/gsm8k/train.parquet \
      data.val_files=/data/gsm8k/test.parquet \
      data.train_batch_size=${VERL_TRAIN_BATCH_SIZE} \
      data.max_prompt_length=${VERL_MAX_PROMPT_LENGTH} \
      data.max_response_length=${VERL_MAX_RESPONSE_LENGTH} \
      data.filter_overlong_prompts=True \
      data.truncation=error \
      actor_rollout_ref.model.path=${VERL_MODEL} \
      actor_rollout_ref.actor.optim.lr=${VERL_LR} \
      actor_rollout_ref.model.use_remove_padding=True \
      actor_rollout_ref.actor.ppo_mini_batch_size=${VERL_MINI_BATCH_SIZE} \
      actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=${VERL_MICRO_BATCH_SIZE} \
      actor_rollout_ref.actor.use_kl_loss=True \
      actor_rollout_ref.actor.kl_loss_coef=0.1 \
      actor_rollout_ref.actor.kl_loss_type=low_var_kl \
      actor_rollout_ref.actor.clip_ratio=0.2 \
      actor_rollout_ref.actor.entropy_coeff=0 \
      actor_rollout_ref.model.enable_gradient_checkpointing=${VERL_GRADIENT_CHECKPOINTING} \
      actor_rollout_ref.actor.fsdp_config.param_offload=${VERL_ACTOR_PARAM_OFFLOAD} \
      actor_rollout_ref.actor.fsdp_config.optimizer_offload=${VERL_ACTOR_OPTIMIZER_OFFLOAD} \
      actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=${VERL_ROLLOUT_LOG_PROB_MICRO_BATCH} \
      actor_rollout_ref.rollout.tensor_model_parallel_size=${VERL_ROLLOUT_TP} \
      actor_rollout_ref.rollout.name=vllm \
      actor_rollout_ref.rollout.gpu_memory_utilization=${VERL_GPU_MEM_UTIL} \
      actor_rollout_ref.rollout.n=${VERL_ROLLOUT_N} \
      actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=${VERL_REF_LOG_PROB_MICRO_BATCH} \
      actor_rollout_ref.ref.fsdp_config.param_offload=${VERL_REF_PARAM_OFFLOAD} \
      algorithm.use_kl_in_reward=False \
      custom_reward_function.path=/scripts/reward.py \
      custom_reward_function.name=compute_score \
      trainer.critic_warmup=0 \
      trainer.logger='["console"]' \
      trainer.project_name=grpo_gsm8k \
      trainer.experiment_name=${VERL_EXPERIMENT} \
      trainer.n_gpus_per_node=${VERL_N_GPUS} \
      trainer.nnodes=${VERL_NNODES} \
      trainer.save_freq=${VERL_SAVE_FREQ} \
      trainer.test_freq=${VERL_TEST_FREQ} \
      trainer.total_epochs=${VERL_TOTAL_EPOCHS} \
      trainer.default_hdfs_dir=null
