# CloudWatch Agent Service Account
# Uses IRSA for AWS access - no static credentials stored
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudwatch-agent
  namespace: amazon-cloudwatch
  labels:
    app: cloudwatch-agent
  annotations:
    # IRSA annotation - role ARN should be set during deployment
    # The IAM role should have CloudWatchAgentServerPolicy attached
    eks.amazonaws.com/role-arn: ${CLOUDWATCH_AGENT_ROLE_ARN}
