apiVersion: v1
kind: ServiceAccount
metadata:
  name: monarch-trainer-sa
  labels:
    app: monarch-grpo
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/rl-code-llm-training-dev-grpo-trainer-role
---
# Monarch client RBAC -- required by KubernetesJob to discover worker pod endpoints
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monarch-client-binding
  labels:
    app: monarch-grpo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: monarch-client-role
subjects:
  - kind: ServiceAccount
    name: monarch-trainer-sa
