apiVersion: apps/v1
kind: Deployment
metadata:
  name: monarch-reward
  labels:
    app: monarch-reward
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monarch-reward
  template:
    metadata:
      labels:
        app: monarch-reward
    spec:
      serviceAccountName: monarch-trainer-sa
      nodeSelector:
        node-type: cpu
      containers:
      - name: reward-service
        image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/rl-code-llm-training-dev/monarch-reward:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "1"
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: monarch-reward
  labels:
    app: monarch-reward
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: monarch-reward
