apiVersion: batch/v1
kind: Job
metadata:
  name: grpo-trainer
  labels:
    app: grpo-trainer
    component: model-training
spec:
  completionMode: Indexed
  completions: 2
  parallelism: 2
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: grpo-trainer
        component: model-training
    spec:
      nodeSelector:
        node-type: gpu
      serviceAccountName: grpo-trainer-sa
      restartPolicy: OnFailure
      subdomain: grpo-trainer
      containers:
      - name: trainer
        image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/rl-code-llm-training-dev/trainer:latest
        resources:
          requests:
            cpu: "32"
            memory: "256Gi"
            nvidia.com/gpu: "7"
          limits:
            cpu: "96"
            memory: "384Gi"
            nvidia.com/gpu: "7"
        env:
        - name: NNODES
          value: "2"
        - name: MASTER_ADDR
          value: "grpo-trainer-0.grpo-trainer"
        - name: MASTER_PORT
          value: "29400"
        - name: MODEL_NAME
          valueFrom:
            configMapKeyRef:
              name: training-config
              key: model_name
        - name: ENVIRONMENT_SERVICE_URL
          value: "http://environment-service:8080"
        - name: CHECKPOINT_DIR
          value: "/checkpoints"
        - name: BATCH_SIZE
          valueFrom:
            configMapKeyRef:
              name: training-config
              key: batch_size
        - name: NUM_EPOCHS
          valueFrom:
            configMapKeyRef:
              name: training-config
              key: num_epochs
        - name: GROUP_SIZE
          valueFrom:
            configMapKeyRef:
              name: training-config
              key: group_size
        - name: LEARNING_RATE
          valueFrom:
            configMapKeyRef:
              name: training-config
              key: learning_rate
        - name: KL_COEF
          valueFrom:
            configMapKeyRef:
              name: training-config
              key: kl_coef
        - name: CLIP_RANGE
          valueFrom:
            configMapKeyRef:
              name: training-config
              key: clip_range
        - name: MAX_SAMPLES
          valueFrom:
            configMapKeyRef:
              name: training-config
              key: max_samples
        - name: CHECKPOINT_INTERVAL
          valueFrom:
            configMapKeyRef:
              name: training-config
              key: checkpoint_interval
        - name: AWS_DEFAULT_REGION
          value: "us-east-1"
        - name: VLLM_SERVER_URL
          value: "http://vllm-server:8000"
        volumeMounts:
        - name: shm
          mountPath: /dev/shm
        - name: checkpoints
          mountPath: /checkpoints
      volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
      - name: checkpoints
        emptyDir:
          sizeLimit: 100Gi
      terminationGracePeriodSeconds: 300
