apiVersion: v1
kind: ConfigMap
metadata:
  name: training-config
  labels:
    app: grpo-trainer
    component: configuration
data:
  model_name: "Qwen/Qwen2.5-1.5B"
  batch_size: "4"
  num_epochs: "1"
  group_size: "8"
  learning_rate: "5e-6"
  kl_coef: "0.1"
  clip_range: "0.2"
  max_grad_norm: "1.0"
  max_new_tokens: "1024"
  max_samples: "7473"
  checkpoint_interval: "50"
