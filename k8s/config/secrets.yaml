# Training Secrets Template
# Contains sensitive configuration for GRPO training
# NOTE: This is a template - replace placeholder values before applying
apiVersion: v1
kind: Secret
metadata:
  name: training-secrets
  labels:
    app: grpo-trainer
    component: configuration
type: Opaque
stringData:
  # S3 bucket for checkpoints
  s3_bucket: "your-checkpoint-bucket-name"
  # AWS credentials (if not using IAM roles for service accounts)
  # aws_access_key_id: "YOUR_ACCESS_KEY"
  # aws_secret_access_key: "YOUR_SECRET_KEY"
